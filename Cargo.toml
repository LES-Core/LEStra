[workspace]
members = ["crates/lestra-core", "crates/lestra-codec", "crates/lestra-sdk", "crates/lestra-crypto"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LES-Core/LEStra"
authors = ["LES Core contributors"]
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = "deny"
