name: Protocol vectors

on:
  # Always emit stable status checks for PRs, including dependency-only PRs.
  # Workflow-level PR path filters make required checks disappear/pending.
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'docs/wire-protocol-*'
    paths:
      - 'spec/v1/**'
      - 'tools/generate_vectors.py'
      - 'tools/test_vectors.py'
      - 'tools/test_handshake_state.py'
      - 'tools/test_handshake_network.py'
      - 'tools/requirements-vectors.txt'
      - 'tools/protocol-vectors-rust/**'
      - '.github/workflows/protocol-vectors.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-vectors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-reference:
    name: Python vectors and handshake state model
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-vectors.txt
      - run: python -m pip install -r tools/requirements-vectors.txt
      - run: python tools/generate_vectors.py --check
      - run: python tools/test_vectors.py -v
      - run: python tools/test_handshake_state.py -v
      - run: python tools/test_handshake_network.py -v

  rust-independent:
    name: Rust independent Noise verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/protocol-vectors-rust
      - name: Compare Noise and AEAD fixtures using Rust
        run: cargo test --manifest-path tools/protocol-vectors-rust/Cargo.toml

  # One stable status context to configure in the main ruleset.
  # A green general Rust CI status alone does not validate Python fixtures.
  required:
    name: lestra-protocol-vectors-required
    needs: [python-reference, rust-independent]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful Python and independent Rust verification
        shell: bash
        env:
          PYTHON_RESULT: ${{ needs.python-reference.result }}
          RUST_RESULT: ${{ needs.rust-independent.result }}
        run: |
          if [[ "$PYTHON_RESULT" != "success" || "$RUST_RESULT" != "success" ]]; then
            echo "Protocol vector gate failed: python=$PYTHON_RESULT rust=$RUST_RESULT"
            exit 1
          fi
          echo "Python and independent Rust protocol checks both passed."
